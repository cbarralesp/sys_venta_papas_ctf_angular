<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand__icon">🍟</span>
      <h1 class="login-brand__title">¡Bienvenido!</h1>
      <p class="login-brand__sub">Ingresa tus credenciales para continuar</p>
    </div>

    <form class="login-form" (ngSubmit)="ingresar()" #loginForm="ngForm">
      @if (contrasenaActualizada()) {
        <p class="login-success" role="status">Contraseña actualizada. Ingresa nuevamente con tu nueva clave.</p>
      }
      <div class="field">
        <label class="field__label" for="usuario">Usuario</label>
        <input
          id="usuario"
          class="field__input"
          type="text"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          [class.field__input--error]="error() !== null"
          [ngModel]="usuario()"
          (ngModelChange)="usuario.set($event); error.set(null)"
          name="usuario"
          required
        />
      </div>

      <div class="field">
        <label class="field__label" for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          class="field__input"
          type="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          [class.field__input--error]="error() !== null"
          [ngModel]="contrasena()"
          (ngModelChange)="contrasena.set($event); error.set(null)"
          name="contrasena"
          required
        />
      </div>

      @if (error(); as mensaje) {
        <p class="login-error" role="alert">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ mensaje }}
        </p>
      }

      <button class="login-btn" type="submit" [disabled]="cargando()">
        @if (cargando()) {
          <span class="login-btn__spinner" aria-hidden="true"></span>
          Verificando...
        } @else {
          Ingresar
        }
      </button>
    </form>
  </div>
</div>
