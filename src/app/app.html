<div class="app-shell">
  <button class="mobile-overlay" [class.is-visible]="menuOpen()" type="button" aria-label="Cerrar menú" (click)="closeMenu()"></button>

  <aside class="sidebar" [class.is-open]="menuOpen()">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">{{ negocio().informacion.icono }}</div>
      <div>
        <strong>{{ negocio().informacion.nombre }}</strong>
        <span>{{ negocio().informacion.subtitulo }}</span>
      </div>
      <button class="sidebar__close" type="button" aria-label="Cerrar menú" (click)="closeMenu()">×</button>
    </div>

    <nav class="navigation" aria-label="Navegación principal">
      <a class="nav-item" routerLink="/caja" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span>Caja</span>
      </a>
      <a class="nav-item" routerLink="/pedidos" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2m6 2V2M8 9h8m-8 4h8m-8 4h5"/></svg>
        <span>Pedidos</span>
      </a>
      <a class="nav-item" routerLink="/cocina" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v6M6.5 8.5 9 11M17.5 8.5 15 11M4 15h16a1 1 0 0 1 1 1 6 6 0 0 1-6 6H9a6 6 0 0 1-6-6 1 1 0 0 1 1-1z"/></svg>
        <span>Cocina</span>
      </a>
      <a class="nav-item" routerLink="/pantalla" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Pantalla</span>
      </a>
      <a class="nav-item" routerLink="/finanzas" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 8.5c-.7-.9-1.8-1.5-3.2-1.5-1.8 0-3.1.9-3.1 2.3 0 3.5 6.6 1.4 6.6 5 0 1.5-1.4 2.7-3.4 2.7-1.6 0-2.9-.7-3.7-1.8M12.7 5v14"/></svg>
        <span>Finanzas</span>
      </a>
      <a class="nav-item" routerLink="/productos" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 8-4 8 4-8 4zM4 7v10l8 4 8-4V7M12 11v10"/></svg>
        <span>Productos</span>
      </a>
      <a class="nav-item" routerLink="/reportes" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7h4v7zm6 0V8h4v13zm6 0V3h4v18z"/></svg>
        <span>Reportes</span>
      </a>
      <a class="nav-item" routerLink="/ajustes" routerLinkActive="nav-item--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <button class="logout" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 17 5-5-5-5m5 5H3m10-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </aside>

  <div class="workspace">
    <header class="mobile-header">
      <button class="menu-button" type="button" aria-label="Abrir menú" (click)="toggleMenu()"><span></span><span></span><span></span></button>
      <div class="mobile-brand"><span>{{ negocio().informacion.icono }}</span><strong>{{ negocio().informacion.nombre }}</strong></div>
    </header>
    <main class="main-content"><router-outlet /></main>
  </div>
</div>
